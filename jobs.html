<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Roles | Remoti</title>
    <link rel="icon" type="image/jpeg" href="imagenes/logo.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="navbar">
        <div class="logo-container">
            <a href="index.html">
                <img src="imagenes/logo.jpg" alt="Remoti Logo" class="logo-img">
            </a>
        </div>
        <nav class="nav-links">
            <div class="dropdown">
                <a href="info.html" class="dropbtn">Cast & Crew Info</a>
            </div>
            <div class="dropdown">
                <a href="managers.html" class="dropbtn">Managers</a>
            </div>
            <div class="dropdown">
                <a href="jobs.html" class="dropbtn">Jobs</a>
            </div>
        </nav>
    </header>

    <main class="main-content">
        
        <!-- SECCIÓN 1: DIRECTORIO DE TRABAJOS (Visible al inicio) -->
        <div id="jobsDirectorySection">
            <h2 class="section-title">Jobs & Vacancies Directory</h2>
            <p class="section-subtitle">Select a role to view requirements and interview preparation guides.</p>

            <section class="controls-section">
                <input type="text" id="jobSearchInput" class="search-bar" placeholder="Search by role, manager, technology...">
                
                <div class="filters-container" id="jobFiltersContainer">
                    <button class="filter-btn active" data-filter="All">All</button>
                    <button class="filter-btn" data-filter="Engineering">Engineering</button>
                    <button class="filter-btn" data-filter="QA">Quality Assurance</button>
                    <button class="filter-btn" data-filter="Senior">Senior</button>
                    <button class="filter-btn" data-filter="Mid-Level">Mid-Level</button>
                </div>
            </section>

            <div id="jobsGrid" class="card-container three-columns">
                <!-- JavaScript inyectará las tarjetas aquí -->
            </div>
        </div>

        <!-- SECCIÓN 2: DETALLE DEL TRABAJO (Oculto al inicio) -->
        <div id="jobDetailSection" class="hidden">
            <button class="back-btn" onclick="hideJobDetail()">&larr; Back to Directory</button>
            
            <!-- JavaScript llenará este contenedor -->
            <div id="jobDetailContent"></div>
        </div>

    </main>

    <!-- EL MODAL DE PREPARACIÓN DE ENTREVISTA -->
    <div id="prepModal" class="modal-window">
        <div class="modal-content">
            <button class="modal-close" onclick="closePrepModal()">&times;</button>
            
            <div class="modal-header-area">
                <h2 id="modalPrepTitle">Job - Stage</h2>
                <p id="modalPrepDuration" class="hidden"><strong>Duration:</strong> <span></span></p>
                <p id="modalPrepPlatform" class="hidden"><strong>Platform:</strong> <span></span></p>
                <p id="modalPrepFormat" class="hidden"><strong>Format:</strong> <span></span></p>
            </div>

            <div class="modal-body" id="modalPrepBody">
                <!-- JavaScript inyectará el contenido: setup, expect, prepare, recommendations, internal notes -->
            </div>

            <div class="modal-footer">
                <button class="copy-btn" id="copyPrepBtn">Copy Prep to Clipboard</button>
            </div>
        </div>
    </div>

    <!-- NOTIFICACIÓN TOAST -->
    <div id="toast">Prep copied successfully!</div>

    <!-- EL CEREBRO DE ESTA PÁGINA -->
    <script src="jobs.js"></script>
</body>
</html>
