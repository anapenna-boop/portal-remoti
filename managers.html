<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hiring Managers | Remoti</title>
    <link rel="icon" type="image/jpeg" href="imagenes/logo.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="navbar">
        <div class="logo-container">
            <a href="index.html">
                <img src="imagenes/logo.jpg" alt="Remoti Logo" class="logo-img">
            </a>
        </div>
        <nav class="nav-links">
            <div class="dropdown">
                <a href="info.html" class="dropbtn">Cast & Crew Info</a>
            </div>
            <div class="dropdown">
                <a href="managers.html" class="dropbtn">Managers</a>
            </div>
            <div class="dropdown">
                <a href="jobs.html" class="dropbtn">Jobs</a>
                <div class="dropdown-content">
                    <a href="jobs.html#developers">Developers</a>
                    <a href="jobs.html#qa">Quality Assurance</a>
                </div>
            </div>
            <div class="dropdown">
                <a href="preps.html" class="dropbtn">Preps</a>
            </div>
        </nav>
    </header>

    <main class="main-content">
        <h2 class="section-title">Manager Insights</h2>
        <p class="section-subtitle">Understand each Hiring Manager’s style, priorities, and interview expectations.</p>

        <!-- SECCIÓN DE BÚSQUEDA Y FILTROS SIMPLIFICADA -->
        <section class="controls-section">
            <input type="text" id="searchInput" class="search-bar" placeholder="Search manager by name, title, role or keyword...">
            
            <div class="filters-container" id="filtersContainer">
                <button class="filter-btn active" data-filter="All">All</button>
                <button class="filter-btn" data-filter="Engineering">Engineering</button>
                <button class="filter-btn" data-filter="QA">QA</button>
                <button class="filter-btn" data-filter="AI">AI</button>
                <button class="filter-btn" data-filter="Finance">Finance</button>
            </div>
        </section>

        <!-- CONTENEDOR DONDE JAVASCRIPT INYECTARÁ LAS TARJETAS -->
        <div id="managersGrid" class="card-container exec-grid">
            <!-- Las tarjetas aparecerán aquí automáticamente -->
        </div>
    </main>

    <!-- EL MODAL (VENTANA EMERGENTE) -->
    <div id="managerModal" class="modal-window">
        <div class="modal-content">
            <button id="closeModalBtn" class="modal-close">&times;</button>
            
            <div class="modal-header-area">
                <h2 id="modalName">Name</h2>
                <p id="modalTitle" class="modal-title">Title</p>
                <p id="modalMeta" class="modal-meta">Location / Roles</p>
                <div id="modalTags" class="tags-container" style="margin-bottom: 10px;"></div>
                <div id="modalLinkedinContainer"></div>
            </div>

            <div class="modal-body-split">
                <!-- Columna Izquierda: Estilo del Manager -->
                <div class="modal-column">
                    <h4>Manager Style</h4>
                    <p id="modalStyle"></p>
                    
                    <h4>What They Value</h4>
                    <ul id="modalValues"></ul>
                </div>
                
                <!-- Columna Derecha: Guía de Entrevista -->
                <div class="modal-column">
                    <h4>Interview Style</h4>
                    <p id="modalInterview"></p>
                    
                    <div class="highlight-box">
                        <h4 style="margin-top:0; border:none; padding:0; color: var(--tech-blue);">Candidate Do's</h4>
                        <ul id="modalDos"></ul>
                    </div>

                    <div class="danger-box">
                        <h4>Watch Outs</h4>
                        <ul id="modalWatchOuts"></ul>
                    </div>
                    
                    <div id="modalInternalNoteContainer"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- CONECTAMOS EL CEREBRO JAVASCRIPT -->
    <script src="script.js"></script>
</body>
</html>
